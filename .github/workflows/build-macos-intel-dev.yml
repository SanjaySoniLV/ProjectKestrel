name: Build macOS Intel Dev (x86_64)

# Proof-of-build for an Intel (x86_64) macOS DMG — direct-download, NOT App Store,
# NOT sandboxed. The current direct-download build (build-macos.yml) runs on
# macos-latest (Apple Silicon), so it is arm64-only; this explores whether the
# same unsandboxed PyInstaller spec builds + validates natively on Intel.
#
# Strategy: run on macos-13 (the last Intel GitHub runner — macos-14/15/latest
# are arm64). Native x86_64 Python + x86_64 wheels => a pure x86_64 binary, no
# fat-binary/universal2 requirement (which failed because deps ship arch-specific
# wheels). If this is green, an Intel DMG is feasible by adding a macos-13 matrix
# leg to the production signing workflow.

on:
  workflow_dispatch:
  push:
    branches: [ mac-intel-dmg ]

jobs:
  build-macos-intel-dev:
    runs-on: macos-13   # Intel runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Confirm runner is x86_64
        shell: bash
        run: |
          echo "uname -m: $(uname -m)"
          echo "arch: $(arch || true)"
          [ "$(uname -m)" = "x86_64" ] || echo "::warning::runner is not x86_64 ($(uname -m)) — macos-13 expected to be Intel"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Confirm Python is x86_64
        shell: bash
        run: |
          python -c "import platform,sys; print('python machine:', platform.machine()); print('maxsize64:', sys.maxsize > 2**32)"

      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv2
          source .venv2/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt
          pip install pyinstaller pytest

      - name: Run pytest (skip ui marker)
        id: pretest
        continue-on-error: true
        shell: bash
        run: |
          source .venv2/bin/activate
          python -m pytest analyzer/tests/ -m "not ui" -q --tb=short

      - name: Warn if pre-build pytest failed
        if: ${{ always() && steps.pretest.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Pre-build pytest failed on Intel dev build; continuing to PyInstaller."

      - name: Run macOS headless build (Intel, unsandboxed spec)
        shell: bash
        run: |
          chmod +x packaging/build_app_headless.sh
          ./packaging/build_app_headless.sh

      - name: Verify binary architecture is x86_64
        shell: bash
        run: |
          set -euo pipefail
          BIN="analyzer/dist/ProjectKestrel/ProjectKestrel"
          echo "=== main binary ==="
          lipo -archs "$BIN" || file "$BIN"
          echo "=== sample native libs ==="
          find analyzer/dist/ProjectKestrel -type f \( -name "*.dylib" -o -name "*.so" \) | head -8 | while read -r f; do
            printf '%-55s ' "$(basename "$f")"; lipo -archs "$f" 2>/dev/null || echo "?"
          done
          ARCHS=$(lipo -archs "$BIN" 2>/dev/null || echo "")
          echo "main binary archs: $ARCHS"
          echo "$ARCHS" | grep -q x86_64 || { echo "::error::binary is not x86_64 (archs: $ARCHS)"; exit 1; }
          echo "x86_64 Intel build confirmed"

      - name: Run --validate against frozen Intel binary
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/validate-result.json"; rm -f "$OUT"
          analyzer/dist/ProjectKestrel/ProjectKestrel \
            --cli --validate --no-gpu --validate-images test_imgs --validate-output "$OUT"
          [ -f "$OUT" ] || { echo "no result JSON"; exit 1; }
          echo "=== validate-result.json ==="; cat "$OUT"; cp "$OUT" validate-result.json
          ok=$(python3 -c "import json;print(str(json.load(open('$OUT')).get('ok')).lower())")
          [ "$ok" = "true" ] || { echo "Validation failed (ok=$ok)"; exit 1; }

      - name: Warn if frozen --validate failed
        if: ${{ always() && steps.validate.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Intel frozen --validate failed; continuing to publish artifacts."

      - name: UI probe (visualizer.html) against frozen Intel binary
        id: ui_probe
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          BIN="analyzer/dist/ProjectKestrel/ProjectKestrel"
          PAT="dist/ProjectKestrel/ProjectKestrel"
          OUT="${RUNNER_TEMP}/ui-probe-result.json"; rm -f "$OUT"
          ELOG="${RUNNER_TEMP}/ui-probe.err"
          "$BIN" --api-probe --probe-target visualizer \
            --probe-output "$OUT" --probe-timeout 90 --port 8797 >"$ELOG" 2>&1 &
          start=$SECONDS
          while [ $((SECONDS-start)) -lt 110 ]; do
            [ -f "$OUT" ] && { echo "result JSON appeared at t=$((SECONDS-start))s"; break; }
            pgrep -f "$PAT" >/dev/null || { echo "probe exited at t=$((SECONDS-start))s before writing JSON"; break; }
            sleep 1
          done
          pkill -9 -f "$PAT" 2>/dev/null
          echo "=== probe stderr tail(15, non-GET) ==="; grep -vE 'GET /' "$ELOG" 2>/dev/null | tail -15
          [ -f "$OUT" ] || { echo "UI probe did not produce a result JSON"; exit 1; }
          cat "$OUT"; cp "$OUT" ui-probe-result.json
          ok=$(python3 -c "import json;print(str(json.load(open('$OUT')).get('ok')).lower())" 2>/dev/null)
          echo "ok=$ok"
          [ "$ok" = "true" ] || { echo "UI probe failed (ok=$ok)"; exit 1; }
          echo "Intel UI probe PASSED"

      - name: Warn if UI probe failed
        if: ${{ always() && steps.ui_probe.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Intel UI probe failed; visualizer.html did not see window.pywebview.api."

      - name: Collect .app
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          APP_PATH=$(find analyzer/dist -maxdepth 2 -name "*.app" | head -n 1 || true)
          [ -n "$APP_PATH" ] || { echo "No .app found"; exit 1; }
          echo "Found .app: $APP_PATH"
          cp -a "$APP_PATH" artifact/

      - name: Upload macOS Intel dev app
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dev-app
          path: artifact/

      - name: Upload validate-result.json
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dev-validate-result
          path: validate-result.json
          if-no-files-found: warn
          retention-days: 14
