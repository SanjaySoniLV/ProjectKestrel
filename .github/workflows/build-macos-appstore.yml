name: Build macOS App Store (signed .pkg)

# ============================================================================
# SCAFFOLD — produces a sandboxed, signed, App-Store-ready .pkg and (optionally)
# uploads it to App Store Connect. It CANNOT run green until the new secrets
# below are added; the "Preflight" step fails fast with a clear message if any
# are missing. This is intentionally separate from build-macos.yml (the
# Developer ID direct-download DMG), which is left untouched (dual-track).
#
# REQUIRED NEW SECRETS (added by the repo owner in Settings > Secrets):
#   APPLE_APPSTORE_CERT_P12        base64 of the "Apple Distribution" cert (.p12)
#   APPLE_APPSTORE_CERT_PASSWORD   password for that .p12
#   APPLE_INSTALLER_CERT_P12       base64 of the "Apple Distribution" *installer*
#                                  cert, aka "3rd Party Mac Developer Installer" (.p12)
#   APPLE_INSTALLER_CERT_PASSWORD  password for that .p12
#   APPLE_PROVISIONING_PROFILE     base64 of the Mac App Store provisioning
#                                  profile (.provisionprofile) for the App ID
#   APPLE_TEAM_ID                  (already present) Apple Developer Team ID
#   APPLE_ID / APPLE_APP_PASSWORD  (already present) for the App Store upload
#
# REQUIRED INPUTS (workflow_dispatch):
#   bundle_id        reverse-DNS App ID, MUST match the provisioning profile
#   version          CFBundleShortVersionString (e.g. 1.0.0)
#   build_number     CFBundleVersion (monotonic; e.g. a run number)
#   upload           whether to push the .pkg to App Store Connect
#
# Real device validation of the sandbox/bookmark/entitlement behavior still
# has to happen on a Mac after install — CI only proves it builds, signs, and
# passes pkgutil/altool validation.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Reverse-DNS App ID (must match the provisioning profile)"
        required: true
        default: "org.projectkestrel.desktop"
      version:
        description: "CFBundleShortVersionString (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      build_number:
        description: "CFBundleVersion (monotonic integer/dotted)"
        required: true
        default: "1"
      upload:
        description: "Upload the .pkg to App Store Connect after building"
        type: boolean
        required: true
        default: false
      bypass_tests:
        description: "Skip the pytest gate (faster iteration builds only — never for a release)"
        type: boolean
        required: false
        default: false

jobs:
  build-macos-appstore:
    runs-on: macos-latest
    env:
      KESTREL_SPEC: ProjectKestrel-macos-appstore.spec
      KESTREL_BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
      KESTREL_APPSTORE_VERSION: ${{ github.event.inputs.version }}
      KESTREL_APPSTORE_BUILD: ${{ github.event.inputs.build_number }}
      ENTITLEMENTS: analyzer/entitlements/ProjectKestrel.appstore.entitlements
    steps:
      - name: Preflight — required secrets present
        shell: bash
        env:
          APPLE_APPSTORE_CERT_P12: ${{ secrets.APPLE_APPSTORE_CERT_P12 }}
          APPLE_APPSTORE_CERT_PASSWORD: ${{ secrets.APPLE_APPSTORE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for v in APPLE_APPSTORE_CERT_P12 APPLE_APPSTORE_CERT_PASSWORD \
                   APPLE_INSTALLER_CERT_P12 APPLE_INSTALLER_CERT_PASSWORD \
                   APPLE_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Add them in repo Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "All required secrets present."

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv2
          source .venv2/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt
          pip install pyinstaller pytest

      - name: Test gate — pytest (skip ui marker)
        # Skippable ONLY for fast iteration builds via bypass_tests=true. Every
        # release build must leave this on. Guarded so an accidental empty input
        # still runs the gate (only the literal string 'true' skips it).
        if: ${{ github.event.inputs.bypass_tests != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source .venv2/bin/activate
          # Hard gate: block the build (and therefore the upload) if the portable
          # test suite regresses. Same set the dev workflow runs. This is where the
          # sandbox MIME regression (test_visualizer_mime_sandbox.py) goes red — it
          # needs no app launch, so it works even though the App-Store-signed app
          # itself cannot run in CI (it is SIGKILLed outside the App Store context).
          python -m pytest analyzer/tests/ -m "not ui" -q --tb=short

      - name: Generate .icns from logo.png
        shell: bash
        run: |
          set -euo pipefail
          SRC="assets/logo.png"
          ICONSET="${RUNNER_TEMP}/Kestrel.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz "$SRC" --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            dbl=$((sz*2))
            sips -z $dbl $dbl "$SRC" --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o assets/logo.icns

      - name: Build sandboxed app (App Store spec)
        shell: bash
        run: |
          chmod +x packaging/build_app_headless.sh
          ./packaging/build_app_headless.sh

      - name: Verify Tk removed + AuthenticationServices bundled
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find analyzer/dist -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::no .app built"; exit 1; fi
          echo "App bundle: $APP"
          # Guideline 2.5.1: PyInstaller only ships libtk8.6.dylib (which
          # references the private AppKit symbol _NSWindowDidOrderOnScreenNotification)
          # when the _tkinter C-extension is collected. Fail hard if Tk/Tcl slipped
          # back into the bundle so this rejection can never silently return.
          TKHITS=$(find "$APP" \( -iname 'libtk*' -o -iname 'libtcl*' -o -iname '_tkinter*' \) 2>/dev/null || true)
          if [ -n "$TKHITS" ]; then
            echo "::error::Tk/Tcl found in the App Store bundle (Guideline 2.5.1 — private API):"
            echo "$TKHITS"
            exit 1
          fi
          echo "OK - no Tk/Tcl in the bundle."
          # Positive check (Guideline 4 fix): the ASWebAuthenticationSession
          # PyObjC wrapper must be present, or macOS in-app sign-in has no
          # transport and the sandboxed build would error on sign-in.
          if find "$APP" -path '*AuthenticationServices*' 2>/dev/null | grep -q .; then
            echo "OK - AuthenticationServices bundled."
          else
            echo "::error::AuthenticationServices wrapper missing from the bundle — in-app sign-in would be unavailable."
            exit 1
          fi

      - name: Install signing certs into a temporary keychain
        shell: bash
        env:
          APPLE_APPSTORE_CERT_P12: ${{ secrets.APPLE_APPSTORE_CERT_P12 }}
          APPLE_APPSTORE_CERT_PASSWORD: ${{ secrets.APPLE_APPSTORE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASS="kestrel-ci"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$APPLE_APPSTORE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$APPLE_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$APPLE_APPSTORE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign/productbuild find the identities.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Embed provisioning profile + sign (inside-out) + .pkg
        shell: bash
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=$(find analyzer/dist -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::no .app built"; exit 1; fi
          echo "App bundle: $APP"

          # Resolve signing identities from the keychain by their Apple-assigned
          # prefix, so this works whether the Team is an individual ("… Sanjay
          # Soni …") or an organization ("… Project Kestrel LLC …"). Apple sets
          # the certificate CN on issue, not from our CSR.
          IDENTITIES=$(security find-identity -v "$KEYCHAIN")
          echo "$IDENTITIES"
          APP_IDENTITY=$(printf '%s\n' "$IDENTITIES" | grep -o -m1 '"Apple Distribution:[^"]*"' | tr -d '"' || true)
          INSTALLER_IDENTITY=$(printf '%s\n' "$IDENTITIES" | grep -o -m1 '"3rd Party Mac Developer Installer:[^"]*"' | tr -d '"' || true)
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Signing identity not found (app='$APP_IDENTITY' installer='$INSTALLER_IDENTITY')"
            exit 1
          fi
          echo "App identity:       $APP_IDENTITY"
          echo "Installer identity: $INSTALLER_IDENTITY"

          # Embed the provisioning profile.
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"

          # Inside-out signing (App Store). Only the MAIN app executable carries
          # entitlements (sandbox + application-identifier + team-identifier); all
          # nested code is signed with the hardened runtime and NO entitlements,
          # deepest-first, so the outer seals stay valid. Frameworks are signed as
          # concrete versioned bundles — a name-based find misses e.g.
          # Python.framework/Versions/3.11/Python, whose stale signature tripped
          # ITMS-90238 (nested code failed Apple's server-side team requirement).

          # 1) every dylib / .so anywhere (incl. inside frameworks), no entitlements
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | while IFS= read -r -d '' f; do
            codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" "$f"
          done
          # 2) each nested .framework, signed as its concrete version bundle
          find "$APP" -type d -name "*.framework" -print0 | while IFS= read -r -d '' fw; do
            if [ -d "$fw/Versions" ]; then
              for v in "$fw/Versions"/*/ ; do
                if [ ! -d "$v" ]; then continue; fi
                if [ "$(basename "$v")" = "Current" ]; then continue; fi
                codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" "${v%/}"
              done
            else
              codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" "$fw"
            fi
          done
          # 3) any remaining Mach-O executables (detect by magic), minus the main
          #    executable (gets entitlements via the bundle in step 4) and anything
          #    already sealed above
          MAIN_EXE=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist" 2>/dev/null || echo "")
          while IFS= read -r -d '' f; do
            case "$f" in
              "$APP/Contents/MacOS/$MAIN_EXE") continue ;;
              *.dylib|*.so) continue ;;
              *"/Versions/"*) continue ;;
            esac
            if file -b "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" "$f" || true
            fi
          done < <(find "$APP" -type f -perm +111 -print0)
          # 4) finally the whole app bundle WITH entitlements (signs the main exec)
          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" --sign "$APP_IDENTITY" "$APP"

          echo "=== verify codesign ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP" || true

          # Build the App Store .pkg signed with the installer identity.
          mkdir -p artifact
          productbuild --component "$APP" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            artifact/ProjectKestrel-appstore.pkg
          echo "=== pkg built ==="
          pkgutil --check-signature artifact/ProjectKestrel-appstore.pkg || true

      - name: Validate code signatures (team requirement)
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          APP=$(find analyzer/dist -maxdepth 2 -name "*.app" | head -n 1)
          echo "Validating signatures in: $APP"
          # This mirrors Apple's server-side test-requirement (the ITMS-90238 gate):
          # the app AND every nested framework/dylib/.so must chain to a leaf cert
          # whose OU is our Team ID. Warn-only — it never blocks the upload, but a
          # foreign/ad-hoc nested signature shows up here in ~7 min instead of via
          # an Apple email hours later.
          REQ="anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          fail=0
          codesign --verify --deep --strict --verbose=2 "$APP" || { echo "::warning::codesign --verify --deep --strict reported problems"; fail=1; }
          while IFS= read -r -d '' item; do
            if ! codesign --verify -R="$REQ" "$item" >/dev/null 2>&1; then
              echo "::warning::nested code fails the team requirement: ${item#$APP/}"
              codesign -dvv "$item" 2>&1 | grep -E "Authority=|TeamIdentifier=" | sed 's/^/    /' || true
              fail=1
            fi
          done < <(find "$APP" \( -type d -name "*.framework" -o -type f \( -name "*.dylib" -o -name "*.so" \) \) -print0)
          codesign --verify -R="$REQ" "$APP" >/dev/null 2>&1 || { echo "::warning::the app bundle fails the team requirement"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "=================================================================="
            echo "  SIGNATURE VALIDATION FAILED (warn-only). Apple will likely"
            echo "  reject this build with ITMS-90238. Fix signing before trusting it."
            echo "=================================================================="
          else
            echo "OK - the app and all nested frameworks/dylibs satisfy the team requirement ($APPLE_TEAM_ID)."
          fi

      - name: Validate / upload to App Store Connect
        if: ${{ github.event.inputs.upload == 'true' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "Validating the package…"
          xcrun altool --validate-app -f artifact/ProjectKestrel-appstore.pkg \
            -t macos -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"
          echo "Uploading to App Store Connect…"
          xcrun altool --upload-app -f artifact/ProjectKestrel-appstore.pkg \
            -t macos -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"

      - name: Upload .pkg artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-appstore-pkg
          path: artifact/
          if-no-files-found: warn
